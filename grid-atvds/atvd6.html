<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.container {
    border: 1px solid aquamarine;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    height: vh;
    width: 95%;


}
.item {
    border: 1px solid black;

}
#itemA {

    grid-row: 1 /2;
    grid-column: 1/5;
    background-color: dimgrey;
    text-align: center;

}
#itemB {

    grid-row: 2/5;
    grid-column: 1/4;
    text-align: center;
}
#itemC {

    text-align: center;
    grid-row: 2/5;
    grid-column: 4/5;
}

/* #itemD {
    grid-row-start: 4;
    grid-row-end: 6;
    grid-column-start: 1;
    grid-column-end: 6;
} */

</style>
<body>
    <main>
        <div class="container">

        <div class="item" id="itemA">Top</div>
        <div class="item" id="itemB">Principal</div>
        <div class="item" id="itemC">Outro</div>

    </main>
</body>
</html>
