<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.container {
    border: 1px solid aquamarine;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 10px;
    height: vh;
    width: 95%;


}
.item {
    border: 1px solid black;

}
#itemA {
        /* grid-row-start: 1; */
        /* grid-row-end: 2; */
        /* grid-column-start: 1; */
        /* grid-column-end: 6; */

        grid-row: 1 /2;
        grid-column: 1/6;

        background-color: dimgrey;
        text-align: center;

}
#itemB {
    /* grid-row-start: 2; */
    /* grid-row-end: 4; */
    /* grid-column-start: 1; */
    /* grid-column-end: 3; */

    grid-row: 2/4;
    grid-column: 1/3;
}
#itemC {
    /* grid-row-start: 2; */
    /* grid-row-end: 4; */
    /* grid-column-start: 4; */
    /* grid-column-end: 6; */

    grid-row: 2/4;
    grid-column: 3/5;
}
#itemD {
    grid-row-start: 4;
    grid-row-end: 6;
    grid-column-start: 1;
    grid-column-end: 6;
}

</style>
<body>
    <main>
        <div class="container">

        <div class="item" id="itemA">Seg</div>
        <div class="item" id="itemB">Ter</div>
        <div class="item" id="itemC">Qua</div>
        <div class="item" id="itemD">Qui</div>

        <!-- <div class="item">Dom </div> -->
        <!-- <div class="item">8</div> -->

        </div>

    </main>
</body>
</html>
